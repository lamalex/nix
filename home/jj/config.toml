editor = "hx"

[ui]
editor = "hx"
diff-editor = ":builtin"
diff-formatter = ":git"

[[--scope]]
--when.commands = ["diff", "show", "interdiff"]
[--scope.ui]
pager = ["hunk", "pager"]

[aliases]
tug = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@"]

[templates]
log = "builtin_log_compact_full_description"
